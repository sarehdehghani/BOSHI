<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BOSCH Parts | قطعات اصلی بوش</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0c0f;--bg2:#12161b;--card:#171c22;--tx:#eef1f4;--mu:#8b95a1;--ln:#262d36;--rd:#e20015;--gd:#c9a45c;--sh:0 20px 50px rgba(0,0,0,.5);color-scheme:dark}
[data-theme="light"]{--bg:#f2f3f5;--bg2:#e8eaed;--card:#fff;--tx:#14181d;--mu:#5d6773;--ln:#d6dae0;--sh:0 20px 40px rgba(20,30,50,.12);color-scheme:light}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:90px}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Vazirmatn","Segoe UI",Tahoma,sans-serif;line-height:1.7;transition:background .3s,color .3s}
[lang="en"] body{font-family:"Oswald","Segoe UI",Arial,sans-serif;letter-spacing:.3px}
[hidden]{display:none!important}
.container{width:100%;max-width:1220px;margin:auto;padding:0 20px}
.mu{color:var(--mu)}.sp{flex:1}

.btn{border:1px solid var(--ln);background:transparent;color:var(--tx);padding:8px 16px;border-radius:4px;font:inherit;cursor:pointer;transition:.2s;text-decoration:none;display:inline-block}
.btn:hover{border-color:var(--gd);color:var(--gd)}
.btn-red{background:var(--rd);border-color:var(--rd);color:#fff;font-weight:700}
.btn-red:hover{background:#b80011;border-color:#b80011;color:#fff}
.btn-lg{padding:13px 30px;font-size:1.05rem}

nav{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--ln)}
.nav-in{display:flex;align-items:center;gap:12px;height:72px}
.logo{font:700 1.6rem Oswald,sans-serif;letter-spacing:4px;color:var(--tx);text-decoration:none;display:flex;align-items:center;gap:8px}
.logo b{background:var(--rd);color:#fff;padding:0 8px}
.menu{display:none;gap:22px;margin-inline-start:20px}
.menu a{color:var(--mu);text-decoration:none}.menu a:hover{color:var(--gd)}
@media(min-width:900px){.menu{display:flex}}
.badge{background:var(--rd);color:#fff;border-radius:20px;padding:0 8px;font-size:.78rem;margin-inline-start:6px;border:1px solid #fff3}
.btn-red .badge{background:#0006}

.hero{position:relative;overflow:hidden;padding:80px 0 70px;background:radial-gradient(900px 400px at 80% 0,rgba(226,0,21,.18),transparent),linear-gradient(180deg,var(--bg2),var(--bg))}
.hero::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(45deg,transparent 0 14px,rgba(255,255,255,.015) 14px 15px);pointer-events:none}
.hero-in{display:grid;gap:30px;align-items:center;position:relative;z-index:1}
@media(min-width:800px){.hero-in{grid-template-columns:1fr 1fr}}
.eyebrow{color:var(--gd);letter-spacing:3px;font-size:.85rem;text-transform:uppercase;font-weight:600}
h1{font-size:clamp(2.2rem,5.5vw,4.2rem);line-height:1.15;margin:12px 0 18px;font-weight:800}
h1 span{color:var(--rd)}h1 em{font-style:normal}
.hero p{max-width:520px;color:var(--mu);font-size:1.1rem}
.cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px}
.gear{width:min(380px,80vw);margin:auto;animation:spin 40s linear infinite;filter:drop-shadow(0 0 30px rgba(226,0,21,.35))}
@keyframes spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.gear{animation:none}html{scroll-behavior:auto}}

.stats{border-block:1px solid var(--ln);background:var(--bg2)}
.grid4{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
@media(min-width:800px){.grid4{grid-template-columns:repeat(4,1fr)}}
.stat{text-align:center;padding:22px 0}
.stat strong{display:block;font:700 2rem Oswald,sans-serif;color:var(--gd)}.stat small{color:var(--mu)}

section{padding:70px 0}section.alt{background:var(--bg2)}
h2{font-size:clamp(1.6rem,3vw,2.4rem);font-weight:800;margin:0 0 6px}
h2::after{content:"";display:block;width:64px;height:3px;background:var(--rd);margin-top:10px}
.tools{display:flex;flex-wrap:wrap;gap:10px;margin:22px 0 4px}
input,select{background:var(--card);border:1px solid var(--ln);color:var(--tx);border-radius:4px;padding:9px 14px;font:inherit}
input{flex:1;min-width:200px}input:focus,select:focus{outline:2px solid var(--gd)}
.chip.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px;margin-top:22px}
.p{background:var(--card);border:1px solid var(--ln);border-radius:6px;display:flex;flex-direction:column;position:relative;overflow:hidden;transition:.25s}
.p:hover{transform:translateY(-5px);border-color:var(--gd);box-shadow:var(--sh)}
.pic{height:150px;display:grid;place-items:center;font-size:3.6rem;background:linear-gradient(135deg,var(--bg2),var(--card));border-bottom:1px solid var(--ln);cursor:pointer}
.tag{position:absolute;top:10px;inset-inline-start:10px;background:var(--gd);color:#111;font-size:.72rem;font-weight:700;padding:1px 9px;border-radius:2px}
.pb{padding:16px;display:flex;flex-direction:column;gap:6px;flex:1}
.pb h3{font-size:1.05rem;margin:0;cursor:pointer}
.pn{font:.78rem Oswald,monospace;color:var(--mu);letter-spacing:1px}
.stock{font-size:.8rem;color:#3fb27f}.stock.low{color:#e8a13a}
.pf{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.price{font:700 1.35rem Oswald,sans-serif}
.old{text-decoration:line-through;color:var(--mu);font-size:.9rem;margin-inline-start:8px}
.empty{text-align:center;color:var(--mu);margin-top:30px}

.timeline{margin-top:40px;padding-inline-start:30px;border-inline-start:2px solid var(--ln)}
.ev{position:relative;margin-bottom:28px;background:var(--card);border:1px solid var(--ln);padding:18px 22px;border-radius:6px}
.ev::before{content:"";position:absolute;inset-inline-start:-39px;top:24px;width:14px;height:14px;background:var(--rd);border:3px solid var(--bg2);border-radius:50%}
.ev em{font:700 1.6rem Oswald,sans-serif;color:var(--gd);font-style:normal}
.ev h3{margin:2px 0}
.feats{margin-top:26px}
.ft{background:var(--card);border:1px solid var(--ln);border-radius:6px;padding:26px}
.ft i{font-size:2rem;font-style:normal}

footer{background:#06080a;color:#aab2bc;padding:40px 0;border-top:3px solid var(--rd)}
.foot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:14px}.foot .logo{color:#fff}

.ov{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:90;display:flex;justify-content:flex-end}
.ov.center{justify-content:center;align-items:center}
.drawer{width:min(420px,100%);height:100%;background:var(--bg);border-inline-start:1px solid var(--ln);padding:22px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.modal{width:min(620px,94%);max-height:90%;overflow:auto;background:var(--bg);border:1px solid var(--gd);border-radius:8px;padding:26px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.ci{display:flex;gap:12px;align-items:center;border-bottom:1px solid var(--ln);padding-bottom:12px}
.ci .ic{font-size:2rem}.ci .info{flex:1}
.qty{display:flex;align-items:center;gap:8px}.qty button{width:30px;height:30px;padding:0}
.total{font-size:1.3rem;font-weight:800;margin:8px 0 14px}
.toast{position:fixed;bottom:24px;inset-inline-start:24px;background:var(--gd);color:#111;padding:12px 22px;border-radius:4px;font-weight:700;z-index:99}

/* ---------- Responsive ---------- */
html,body{max-width:100%;overflow-x:hidden}
img,svg{max-width:100%;height:auto}
.grid>*,.grid4>*,.hero-in>*{min-width:0}
.grid{grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr))}
@media(max-width:900px){
  section{padding:54px 0}
  .hero{padding:56px 0 48px}
  .hero-in{text-align:center}
  .hero p{margin-inline:auto}
  .cta{justify-content:center}
  .gear{width:min(280px,65vw)}
}
@media(max-width:600px){
  .container{padding:0 14px}
  .nav-in{gap:6px;height:62px}
  .logo{font-size:1.25rem;letter-spacing:2px}
  .logo small{display:none}
  .btn{padding:7px 11px}
  .btn-lg{padding:12px 20px;font-size:1rem;flex:1;text-align:center}
  .stat{padding:14px 0}.stat strong{font-size:1.5rem}
  .tools{gap:8px}
  select,input{width:100%;flex:1 1 100%}
  #cats{flex-wrap:nowrap;overflow-x:auto;padding-bottom:8px;-webkit-overflow-scrolling:touch}
  #cats .chip{white-space:nowrap;flex:none}
  .grid{grid-template-columns:repeat(2,1fr);gap:12px}
  .pic{height:110px;font-size:2.8rem}
  .pb{padding:12px}.pb h3{font-size:.95rem}.price{font-size:1.1rem}
  .old{display:block;margin:0}
  .timeline{padding-inline-start:20px}
  .ev{padding:14px 16px}.ev::before{inset-inline-start:-29px}
  .modal{padding:18px}
  .toast{inset-inline:14px;text-align:center}
  .foot{flex-direction:column}
}
@media(max-width:360px){.grid{grid-template-columns:1fr}}

</style>
</head>

    H('1902','شمع پرولتاژ','High-voltage spark plug','با همکاری گوتلوب هونولد، اولین شمع کاربردی خودرو ساخته شد.','With Gottlob Honold, the first practical spark plug for automobiles is introduced.'),
    H('1927','پمپ انژکتور دیزل','Diesel injection pump','تولید انبوه سیستم تزریق دیزل آغاز شد.','Series production of the diesel injection pump begins.'),
    H('1967','تزریق الکترونیکی','Electronic fuel injection','D-Jetronic، نخستین سیستم تزریق سوخت الکترونیک، معرفی شد.','D-Jetronic, the first electronic fuel injection system, arrives.'),
    H('1978','ترمز ABS','ABS braking','بوش اولین سیستم ABS تولید انبوه جهان را عرضه کرد.','Bosch introduces the world’s first series-production ABS.'),
    H('1995','کنترل پایداری ESP','ESP stability control','سیستم ESP جان هزاران رانندگان را نجات داد.','ESP stability control goes on to save thousands of lives.')
  ];
  var FEATS = [
    {ic:'🛡',fa:'اصالت تضمینی',en:'Guaranteed Genuine',dfa:'همه قطعات با کد و هولوگرام اصلی.',den:'Every part ships with its original code and hologram.'},
    {ic:'🚚',fa:'ارسال سریع',en:'Fast Delivery',dfa:'ارسال رایگان بالای ۱۵۰ دلار.',den:'Free shipping on orders over $150.'},
    {ic:'🔧',fa:'مشاوره فنی',en:'Expert Advice',dfa:'انتخاب قطعه مناسب با کمک مهندسان.',den:'Pick the right part with engineer support.'},
    {ic:'↩',fa:'بازگشت ۱۴ روزه',en:'14-Day Returns',dfa:'ضمانت بازگشت وجه بدون دردسر.',den:'Hassle-free refunds within 14 days.'}
  ];

  /* ---------- State ---------- */
  var S = {lang:'fa', theme:'dark', cat:'', q:'', sort:'', cart:[]};
  function load(k, d) { try { var v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } }
  function save(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  S.lang = load('b_lang', 'fa');
  S.theme = load('b_theme', window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  try { S.cart = JSON.parse(load('b_cart', '[]')).filter(function (i) { return byId(i.id); }); } catch (e) { S.cart = []; }

  /* ---------- Helpers ---------- */
  var $ = function (id) { return document.getElementById(id); };
  function byId(id) { return PRODUCTS.filter(function (p) { return p.id === id; })[0]; }
  function t(k) { return TX[S.lang][k] || k; }
  function num(n) { return S.lang === 'fa' ? Number(n).toLocaleString('fa-IR') : String(n); }
  function money(u) {
    return S.lang === 'fa'
      ? (Math.round(u * 70) * 1000).toLocaleString('fa-IR') + ' ' + TX.fa.cur
      : '$' + u.toFixed(2);
  }
  function count() { return S.cart.reduce(function (a, i) { return a + i.q; }, 0); }
  function total() { return S.cart.reduce(function (a, i) { return a + i.q * byId(i.id).usd; }, 0); }
  var toastTimer;
  function toast(m) {
    var el = $('toast'); el.textContent = m; el.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { el.hidden = true; }, 1800);
  }

  /* ---------- Render ---------- */
  function applyStatic() {
    var h = document.documentElement;
    h.lang = S.lang; h.dir = S.lang === 'fa' ? 'rtl' : 'ltr'; h.setAttribute('data-theme', S.theme);
    document.querySelectorAll('[data-t]').forEach(function (el) { el.textContent = t(el.getAttribute('data-t')); });
    $('q').placeholder = t('search');
    $('langBtn').textContent = S.lang === 'fa' ? 'EN' : 'فا';
    $('themeBtn').textContent = S.theme === 'dark' ? '☀' : '☾';
    $('sort').innerHTML = [['', 'sort'], ['usd', 'low'], ['-usd', 'high'], ['-pop', 'pop']].map(function (o) {
      return '<option value="' + o[0] + '"' + (S.sort === o[0] ? ' selected' : '') + '>' + t(o[1]) + '</option>';
    }).join('');
    $('stats').innerHTML = STATS.map(function (s) { return '<div class="stat"><strong>' + s.v + '</strong><small>' + s[S.lang] + '</small></div>'; }).join('');
    $('timeline').innerHTML = HIST.map(function (e) {
      return '<div class="ev"><em>' + e.y + '</em><h3>' + e['t' + S.lang] + '</h3><div class="mu">' + e['d' + S.lang] + '</div></div>';
    }).join('');
    $('feats').innerHTML = FEATS.map(function (f) {
      return '<div class="ft"><i>' + f.ic + '</i><h3>' + f[S.lang] + '</h3><div class="mu">' + f['d' + S.lang] + '</div></div>';
    }).join('');
    $('cats').innerHTML = '<button class="btn chip' + (S.cat === '' ? ' on' : '') + '" data-cat="">' + t('all') + '</button>' +
      CATS.map(function (c) { return '<button class="btn chip' + (S.cat === c.id ? ' on' : '') + '" data-cat="' + c.id + '">' + c.ic + ' ' + c[S.lang] + '</button>'; }).join('');
    renderGrid(); renderCart();
  }

  function renderGrid() {
    var q = S.q.trim().toLowerCase();
    var list = PRODUCTS.filter(function (p) {
      return (!S.cat || p.c === S.cat) && (!q || (p.fa + ' ' + p.en + ' ' + p.pn).toLowerCase().indexOf(q) > -1);
    });
    if (S.sort) {
      var k = S.sort.replace('-', ''), d = S.sort[0] === '-' ? -1 : 1;
      list.sort(function (a, b) { return (a[k] - b[k]) * d; });
    }
    $('grid').innerHTML = list.map(function (p) {
      return '<article class="p">' +
        (p.tag ? '<span class="tag">' + t(p.tag) + '</span>' : '') +
        '<div class="pic" data-open="' + p.id + '">' + p.ic + '</div>' +
        '<div class="pb"><div class="pn">' + p.pn + '</div>' +
        '<h3 data-open="' + p.id + '">' + p[S.lang] + '</h3>' +
        '<div class="stock' + (p.st < 10 ? ' low' : '') + '">● ' + (p.st < 10 ? t('lowst') : t('inst')) + '</div>' +
        '<div class="pf"><div><span class="price">' + money(p.usd) + '</span>' + (p.old ? '<span class="old">' + money(p.old) + '</span>' : '') + '</div>' +
        '<button class="btn btn-red" data-add="' + p.id + '">' + t('add') + '</button></div></div></article>';
    }).join('');
    $('none').hidden = list.length > 0;
  }

  function renderCart() {
    $('cartCount').textContent = num(count());
    var d = $('drawer');
    var ship = total() >= 150 ? 0 : 9;
    d.innerHTML = '<div class="row"><h3 style="margin:0">' + t('cart') + '</h3><button class="btn" data-close="cart">✕</button></div>' +
      (S.cart.length ? S.cart.map(function (i) {
        var p = byId(i.id);
        return '<div class="ci"><div class="ic">' + p.ic + '</div><div class="info"><div>' + p[S.lang] + '</div><small class="mu">' + money(p.usd) + '</small></div>' +
          '<div class="qty"><button class="btn" data-q="-1" data-id="' + p.id + '">−</button><span>' + num(i.q) + '</span><button class="btn" data-q="1" data-id="' + p.id + '">+</button></div></div>';
      }).join('') +
      '<div style="margin-top:auto"><div class="row"><span>' + t('sub_t') + '</span><span>' + money(total()) + '</span></div>' +
      '<div class="row mu"><small>' + t('ship') + '</small><small>' + (ship ? money(ship) : t('free')) + '</small></div>' +
      '<div class="row total"><span>' + t('tot') + '</span><span>' + money(total() + ship) + '</span></div>' +
      '<button class="btn btn-red btn-lg" style="width:100%" data-checkout>' + t('checkout') + '</button></div>'
      : '<p class="mu">' + t('empty') + '</p>');
  }

  function openModal(id) {
    var p = byId(id);
    $('modal').innerHTML = '<div class="row"><div style="font-size:4rem">' + p.ic + '</div><button class="btn" data-close="modal">✕</button></div>' +
      '<div class="pn">' + p.pn + '</div><h2>' + p[S.lang] + '</h2><p>' + p['d' + S.lang] + '</p>' +
      '<div class="eyebrow">' + t('specs') + '</div><ul class="mu">' + p.sp.map(function (s) { return '<li>' + s[S.lang] + '</li>'; }).join('') + '</ul>' +
      '<div class="row"><span class="price">' + money(p.usd) + '</span><button class="btn btn-red" data-add="' + p.id + '" data-close="modal">' + t('add') + '</button></div>';
    $('modalOv').hidden = false;
  }

  /* ---------- Cart actions ---------- */
  function persist() { save('b_cart', JSON.stringify(S.cart)); renderCart(); }
  function add(id) {
    var f = S.cart.filter(function (i) { return i.id === id; })[0];
    if (f) f.q++; else S.cart.push({id: id, q: 1});
    persist(); toast(t('added'));
  }
  function change(id, d) {
    var f = S.cart.filter(function (i) { return i.id === id; })[0];
    if (!f) return;
    f.q += d;
    if (f.q < 1) S.cart.splice(S.cart.indexOf(f), 1);
    persist();
  }

  /* ---------- Events ---------- */
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-add],[data-open],[data-q],[data-cat],[data-checkout],[data-close]');
    if (el) {
      if (el.hasAttribute('data-add')) add(+el.getAttribute('data-add'));
      if (el.hasAttribute('data-open')) openModal(+el.getAttribute('data-open'));
      if (el.hasAttribute('data-q')) change(+el.getAttribute('data-id'), +el.getAttribute('data-q'));
      if (el.hasAttribute('data-cat')) { S.cat = el.getAttribute('data-cat'); applyStatic(); }
      if (el.hasAttribute('data-checkout')) { S.cart = []; persist(); $('cartOv').hidden = true; toast(t('done')); }
      if (el.getAttribute('data-close') === 'cart') $('cartOv').hidden = true;
      if (el.getAttribute('data-close') === 'modal') $('modalOv').hidden = true;
      return;
    }
    if (e.target === $('cartOv')) $('cartOv').hidden = true;
    if (e.target === $('modalOv')) $('modalOv').hidden = true;
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { $('cartOv').hidden = true; $('modalOv').hidden = true; }
  });
  $('cartBtn').addEventListener('click', function () { $('cartOv').hidden = false; });
  $('langBtn').addEventListener('click', function () { S.lang = S.lang === 'fa' ? 'en' : 'fa'; save('b_lang', S.lang); applyStatic(); });
  $('themeBtn').addEventListener('click', function () { S.theme = S.theme === 'dark' ? 'light' : 'dark'; save('b_theme', S.theme); applyStatic(); });
  $('q').addEventListener('input', function (e) { S.q = e.target.value; renderGrid(); });
  $('sort').addEventListener('change', function (e) { S.sort = e.target.value; renderGrid(); });

  applyStatic();
})();

</script>
</body>
</html>
